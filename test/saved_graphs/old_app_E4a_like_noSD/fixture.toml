# A Save graph folder written by the application at commit 7e05f77 (the last
# version before the Nov 5 changes: D shown divided by the domain scale,
# linear ρ profiles centred at ρ0), driven by test/tools/make_old_app_fixtures.jl
# under Xvfb on a 4-core Intel Xeon (AVX-512). The images and the notebook of
# the folder are left out.
