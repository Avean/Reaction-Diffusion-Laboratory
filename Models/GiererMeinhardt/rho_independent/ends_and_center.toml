name = "u strong ends, weak center"
description = "Adds noise to u at both ends (width 6–13% of the panel, amplitude 2–4) and the center (width 3–6%, amplitude 1.2–2.3)."

[initial_values]
u = 0.0
v = 0.0

[[perturbations]]
variable = "u"
position = 0.0
width_min_fraction = 0.06
width_max_fraction = 0.13
height_min = 2.0
height_max = 4.0

[[perturbations]]
variable = "u"
position = 0.5
width_min_fraction = 0.03
width_max_fraction = 0.06
height_min = 1.2
height_max = 2.3

[[perturbations]]
variable = "u"
position = 1.0
width_min_fraction = 0.06
width_max_fraction = 0.13
height_min = 2.0
height_max = 4.0
