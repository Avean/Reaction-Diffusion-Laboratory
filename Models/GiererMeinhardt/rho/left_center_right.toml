name = "u three points"
description = "Adds noise to u at the left end, center and right end: width 6–13% of the panel, amplitude 1–2."

[initial_values]
u = 0.0
v = 0.0

[[perturbations]]
variable = "u"
position = 0.0
width_min_fraction = 0.06
width_max_fraction = 0.13
height_min = 1.0
height_max = 2.0

[[perturbations]]
variable = "u"
position = 0.5
width_min_fraction = 0.06
width_max_fraction = 0.13
height_min = 1.0
height_max = 2.0

[[perturbations]]
variable = "u"
position = 1.0
width_min_fraction = 0.06
width_max_fraction = 0.13
height_min = 1.0
height_max = 2.0
